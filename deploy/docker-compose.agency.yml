version: "3.9"

# Production-style compose for Agency / enterprise-selling on the VPS.
# Auto-starts after reboot via Docker's restart policy (docker.service must be enabled).
#
# Peer apps must call http://127.0.0.1:5005/ (stable).
# With stable proxy installed, map container to a backend (15005/15056) instead:
#   AGENCY_HOST_PORT=15005 docker compose -f deploy/docker-compose.org.yml up -d
#
#   docker compose -f deploy/docker-compose.org.yml up -d --build
#
services:
  org:
    image: ${AGENCY_IMAGE:-mrshoofer-agency:latest}
    container_name: mrshoofer-agency
    restart: always
    ports:
      - "127.0.0.1:${AGENCY_HOST_PORT:-5005}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      TZ: Asia/Tehran
    volumes:
      # Keep live config/data outside the image so restarts don't wipe settings
      - ${AGENCY_CONFIG_DIR:-/root/InterpirceORS/publish}/appsettings.json:/app/appsettings.json:ro
      - ${AGENCY_CONFIG_DIR:-/root/InterpirceORS/publish}/appsettings.Production.json:/app/appsettings.Production.json:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
