# Stable localhost front for Agency so peer apps always call :5005.
# Blue/green instances bind 15005 / 15006; this proxy never moves.
#
# Requires sibling file (managed by deploy):
#   /etc/nginx/conf.d/agency-backend-active.conf
# which defines: upstream agency_app_backend { server 127.0.0.1:PORT; }
#
# Install:
#   ./deploy/scripts/install-stable-localhost-proxy.sh

server {
    listen 127.0.0.1:5005;
    server_name _;

    location / {
        proxy_pass http://agency_app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
